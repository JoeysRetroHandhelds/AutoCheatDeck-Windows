name: release

on:
  push:
    branches: ['**']
    tags: ['v*.*.*']
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    # The app zip carries the signed widget so AutoCheatDeck can install it with one click.
    needs: widget
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install tools
        run: pip install pyinstaller flake8 pystray pillow cryptography
      - name: Lint and test
        run: |
          flake8 --max-line-length=120 autocheatdeck main.py tests tools
          python -m unittest discover -s tests -t .
      - name: Check tag matches app version
        if: github.ref_type == 'tag'
        shell: pwsh
        run: |
          $version = python -c "import autocheatdeck; print(autocheatdeck.__version__)"
          if ("v$version" -ne "${{ github.ref_name }}") { throw "Tag ${{ github.ref_name }} does not match __version__ $version" }
          if (-not (Test-Path "docs/releases/${{ github.ref_name }}.md")) { throw "Write docs/releases/${{ github.ref_name }}.md first" }
      - name: Build app folder
        run: python -m PyInstaller --onedir --noconsole --name AutoCheatDeck --clean -y main.py
      - uses: actions/download-artifact@v5
        with:
          name: AutoCheatDeckWidget
          path: widget-release
      - name: Add the widget
        if: needs.widget.outputs.signed == 'true'
        shell: pwsh
        run: |
          # Only a signed widget can be installed; AutoCheatDeck's "Install Game Bar widget" uses these.
          Copy-Item widget-release -Destination dist/AutoCheatDeck/widget -Recurse
          Remove-Item dist/AutoCheatDeck/widget/*.cer
      - name: Zip and checksum
        shell: pwsh
        run: |
          Copy-Item README.md, LICENSE dist/AutoCheatDeck/
          New-Item -ItemType Directory release | Out-Null
          Compress-Archive -Path dist/AutoCheatDeck -DestinationPath release/AutoCheatDeck-win64.zip
          $hash = (Get-FileHash release/AutoCheatDeck-win64.zip -Algorithm SHA256).Hash.ToLower()
          "$hash *AutoCheatDeck-win64.zip" | Out-File -Encoding ascii -NoNewline release/AutoCheatDeck-win64.zip.sha256
      - name: Sign
        if: github.ref_type == 'tag'
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
        run: python tools/sign_release.py release/AutoCheatDeck-win64.zip ${{ github.ref_name }}
      - uses: actions/upload-artifact@v6
        with:
          name: AutoCheatDeck-win64
          path: release/*
      - name: Publish release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          name: AutoCheatDeck ${{ github.ref_name }}
          body_path: docs/releases/${{ github.ref_name }}.md
          generate_release_notes: true
          files: |
            release/AutoCheatDeck-win64.zip
            release/AutoCheatDeck-win64.zip.sha256
            release/AutoCheatDeck-win64.zip.sig

  widget:
    # The Game Bar widget (UWP). Signed when the WIDGET_SIGNING_PFX secret is set (base64 of the
    # CN=JoeysRetroHandhelds .pfx, password in WIDGET_SIGNING_PASSWORD): Game Bar only lists
    # signed widgets, so only a signed bundle is attached to releases.
    runs-on: windows-2022
    outputs:
      signed: ${{ steps.sign.outputs.signed }}
    steps:
      - uses: actions/checkout@v6
      - uses: microsoft/setup-msbuild@v2
      - name: Package version from the app version
        shell: pwsh
        run: |
          # X.Y.Z -> X.Y.Z.0, so a newer AutoCheatDeck can tell its widget is newer than the installed one.
          $version = python -c "import autocheatdeck; print(autocheatdeck.__version__)"
          $manifest = "widget/AutoCheatDeckWidget/Package.appxmanifest"
          $xml = Get-Content -Raw $manifest
          $xml = $xml -replace '(<Identity[^>]*?Version=")[0-9.]+(")', "`${1}$version.0`${2}"
          Set-Content -NoNewline -Encoding utf8 $manifest $xml
      - name: Build package
        shell: pwsh
        run: >
          msbuild widget/AutoCheatDeckWidget/AutoCheatDeckWidget.csproj /restore /m /v:minimal
          /p:Configuration=Release /p:Platform=x64 /p:AppxBundle=Always "/p:AppxBundlePlatforms=x64|arm64"
          /p:UapAppxPackageBuildMode=SideloadOnly /p:AppxPackageSigningEnabled=false
          "/p:AppxPackageDir=$env:GITHUB_WORKSPACE\widget-out\\"
      - name: Sign
        id: sign
        shell: pwsh
        env:
          PFX: ${{ secrets.WIDGET_SIGNING_PFX }}
          PFX_PASSWORD: ${{ secrets.WIDGET_SIGNING_PASSWORD }}
        run: |
          $bundle = Get-ChildItem widget-out -Recurse -Filter *.msixbundle | Select-Object -First 1
          if (-not $bundle) { throw "No .msixbundle was produced" }
          New-Item -ItemType Directory widget-release | Out-Null
          $out = "widget-release/AutoCheatDeckWidget.msixbundle"
          Copy-Item $bundle.FullName $out
          Copy-Item widget/AutoCheatDeckWidget.cer widget-release/
          # Framework packages (.NET Native, VCLibs) a sideloaded UWP package needs, per architecture.
          foreach ($dep in Get-ChildItem widget-out -Recurse -Include *.appx, *.msix |
                   Where-Object { $_.FullName -match '\\Dependencies\\(x64|arm64)\\' }) {
            $arch = Split-Path (Split-Path $dep.FullName -Parent) -Leaf
            New-Item -ItemType Directory -Force "widget-release/Dependencies/$arch" | Out-Null
            Copy-Item $dep.FullName "widget-release/Dependencies/$arch/"
          }
          Get-ChildItem widget-release -Recurse | ForEach-Object { Write-Output $_.FullName }
          if (-not $env:PFX) {
            Write-Output "::warning::WIDGET_SIGNING_PFX is not set: the widget bundle is unsigned and not released"
            "signed=false" >> $env:GITHUB_OUTPUT
            exit 0
          }
          [IO.File]::WriteAllBytes("$env:RUNNER_TEMP\widget.pfx", [Convert]::FromBase64String($env:PFX))
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" |
            Sort-Object FullName -Descending | Select-Object -First 1
          & $signtool.FullName sign /fd SHA256 /f "$env:RUNNER_TEMP\widget.pfx" /p $env:PFX_PASSWORD $out
          if ($LASTEXITCODE -ne 0) { throw "signtool failed" }
          Remove-Item "$env:RUNNER_TEMP\widget.pfx"
          "signed=true" >> $env:GITHUB_OUTPUT
      - uses: actions/upload-artifact@v6
        with:
          name: AutoCheatDeckWidget
          path: widget-release/*
      - name: Attach to release
        if: github.ref_type == 'tag' && steps.sign.outputs.signed == 'true'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            widget-release/AutoCheatDeckWidget.msixbundle
            widget-release/AutoCheatDeckWidget.cer
