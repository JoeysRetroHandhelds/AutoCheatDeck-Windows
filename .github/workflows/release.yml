name: release

on:
  push:
    branches: ['**']
    tags: ['v*.*.*']
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install tools
        run: pip install pyinstaller flake8
      - name: Lint and test
        run: |
          flake8 --max-line-length=120 autocheatdeck main.py tests
          python -m unittest discover -s tests -t .
      - name: Check tag matches app version
        if: github.ref_type == 'tag'
        shell: pwsh
        run: |
          $version = python -c "import autocheatdeck; print(autocheatdeck.__version__)"
          if ("v$version" -ne "${{ github.ref_name }}") { throw "Tag ${{ github.ref_name }} does not match __version__ $version" }
      - name: Build exe
        run: python -m PyInstaller --onefile --noconsole --name AutoCheatDeck --clean -y main.py
      - name: Checksum
        shell: pwsh
        run: |
          $hash = (Get-FileHash dist/AutoCheatDeck.exe -Algorithm SHA256).Hash.ToLower()
          "$hash *AutoCheatDeck.exe" | Out-File -Encoding ascii -NoNewline dist/AutoCheatDeck.exe.sha256
      - uses: actions/upload-artifact@v6
        with:
          name: AutoCheatDeck
          path: dist/*
      - name: Publish release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          name: AutoCheatDeck ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            dist/AutoCheatDeck.exe
            dist/AutoCheatDeck.exe.sha256
